<!doctype html>
<html lang="en">
  <head>
    <!-- @include head title="Contact | Joachim Prügl" description="Write to Joachim Prügl, frontend developer in Berlin, about roles, freelance work or collaborations." path="contact.html" -->
  </head>
  <body>
    <div class="page">
      <!-- @include header current="contact" -->

      <main id="content" class="stack">
        <header class="indent">
          <h1 class="title">Contact</h1>
          <p class="deck">For roles, freelance work or a collaboration, an email is the quickest way to reach me.</p>
          <p class="mailto" style="margin-top: 2rem"><a href="mailto:joachimpruegl@gmail.com">joachimpruegl@gmail.com</a></p>
          <p class="status">Berlin, Germany</p>
        </header>

        <section class="row" aria-labelledby="message">
          <h2 class="side" id="message">Or a short note</h2>
          <form class="main" action="https://email-form-submission-d82bfb550fe0.herokuapp.com/submit" method="post" accept-charset="utf-8">
            <div class="field">
              <label for="full-name">Name</label>
              <input type="text" name="name" id="full-name" autocomplete="name" required />
            </div>
            <div class="field">
              <label for="email-address">Email</label>
              <input type="email" name="_replyto" id="email-address" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="message-text">Message <span class="hint">up to 240 characters</span></label>
              <textarea name="message" id="message-text" maxlength="240" rows="4" required></textarea>
            </div>
            <button class="button" type="submit" name="_subject" value="Submit">Send message</button>
          </form>
        </section>
      </main>

      <!-- @include footer-min -->
    </div>
  </body>
</html>
